name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Beri nama APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=v$VER" >> "$GITHUB_ENV"
          NAME="AlQuranHadits-v$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: AlQuranHadits-apk
          path: ${{ env.APK_NAME }}
      - name: Buat GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Al-Qur'an & Hadits ${{ env.VER }}
          make_latest: true
          overwrite_files: true
          files: ${{ env.APK_NAME }}
          body: |
            Aplikasi Android Al-Qur'an & Hadits (offline).

            **Unduh:** file `${{ env.APK_NAME }}` di bagian Assets di bawah, lalu pasang di HP
            (izinkan "Instal dari sumber tidak dikenal" bila diminta).

            Fitur:
            - Al-Qur'an 30 juz — teks Arab + terjemahan Kemenag RI 2019
            - 9 kitab hadits (38.102 hadits) — Arab + terjemahan
            - Notifikasi harian ayat (05:30) & hadits (18:30) pilihan, jam bisa diubah
            - Pencarian terpadu Al-Qur'an + hadits, teks Arab, rujukan langsung (2:255, bukhari 1)
            - Keterkaitan ayat ↔ hadits (hadits yang mengutip ayat & tema serupa)
            - Simpan, salin, bagikan, mode gelap

            Pertama kali dibuka aplikasi menyiapkan data (butuh ruang ±160 MB).
